name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Takes the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      # Node 22 is the minimum in `engines`, so CI checks the lowest supported version.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One Playwright version serves both the console smoke test and the Vitest browser project.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm verify

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  # Pending changesets open or update the "version packages" PR; merging it publishes to npm.
  release:
    name: Release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing (OIDC): no npm token is stored in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Trusted publishing needs npm >= 11.5, which ships with Node 24 (Node 22 has npm 10).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # v1 matches Changesets v2; v2 of the action requires Changesets v3 and pnpm 10.
      - uses: changesets/action@v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
          createGithubReleases: true
