name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Takes the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      # Node 22 is the minimum in `engines`, so CI checks the lowest supported version.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The console smoke test (root @playwright/test) and the Vitest browser project
      # (packages/core) pin different Playwright versions, each with its own Chromium build.
      - name: Install Playwright Chromium
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm --filter @smalt-ui/core exec playwright install chromium

      - run: pnpm verify

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
