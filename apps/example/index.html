<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme before the first paint: otherwise the page flashes the system theme until the
         bundle runs. The string comes from colorModeScript() in @smalt-ui/core, see "Theming". -->
    <script>
      ;(function () {
        try {
          var m = localStorage.getItem('smalt-color-mode') || 'auto'
          var d =
            m === 'dark' ||
            (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light')
        } catch (e) {}
      })()
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Smalt UI · Example (Vue 3)</title>
  </head>
  <body>
    <div id="app"></div>
    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
